<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام إدارة العيادة الذكي</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #2196F3; --bg-color: #0F172A; --card-bg: #1E293B;
            --text-main: #F8FAFC; --text-muted: #94A3B8; --warning: #F59E0B; --ai-color: #8B5CF6; --success: #10B981;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 20px; box-sizing: border-box;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card {
            background-color: var(--card-bg); border-radius: 15px;
            padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 20px; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h2 { text-align: center; color: var(--primary); margin-top: 0; }
        h3 { color: var(--primary); border-bottom: 1px solid #334155; padding-bottom: 10px; }
        
        .logo-placeholder {
            width: 80px; height: 80px; background: var(--primary); 
            border-radius: 50%; margin: 0 auto 20px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 35px; box-shadow: 0 0 20px rgba(33, 150, 243, 0.4);
        }
        
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-muted); font-size: 14px;}
        input, select, textarea {
            width: 100%; padding: 12px; margin-bottom: 18px;
            border: 1px solid #334155; border-radius: 8px;
            background-color: #0F172A; color: white; font-size: 16px;
            box-sizing: border-box; transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; }
        
        button {
            width: 100%; padding: 14px; background-color: var(--primary);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px;
        }
        button:active { transform: scale(0.98); }
        button.logout-btn { background-color: #334155; margin-top: 15px; }
        button.edit-btn { background-color: var(--warning); padding: 8px; width: auto; font-size: 14px; margin-top: 10px; color: #000; }
        
        .booking-card {
            background: #0F172A; border-right: 4px solid var(--primary);
            padding: 15px; border-radius: 8px; margin-bottom: 12px;
        }
        .booking-card .seq { color: var(--primary); font-size: 18px; font-weight: bold; margin-bottom: 5px;}
        .status-badge {
            display: inline-block; background-color: #334155; color: #F8FAFC;
            padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-top: 5px;
        }
        
        .hidden { display: none !important; }
        
        .doctor-date-picker {
            display: flex; align-items: center; justify-content: space-between;
            background: #0F172A; padding: 10px; border-radius: 8px; margin-bottom: 20px;
        }
        .doctor-date-picker label { margin-bottom: 0; color: var(--primary); }
        .doctor-date-picker input { width: auto; margin-bottom: 0; padding: 8px; border: none; }

        .ai-box {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid var(--ai-color); padding: 15px; border-radius: 12px;
            margin-bottom: 25px; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.2);
        }
        .ai-box h3 { color: var(--ai-color); border: none; padding: 0; margin-top: 0; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;}
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg); padding: 20px; border-radius: 15px;
            width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto;
        }
        .close-btn { background-color: #EF4444; margin-top: 10px; }
        
        .flex-row { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- شاشة الدخول -->
    <div id="loginScreen" class="card">
        <div class="logo-placeholder">⚕️</div>
        <h2>نظام العيادة الذكي</h2>
        <label>الدخول بصلاحية:</label>
        <select id="roleSelect">
            <option value="secretary">سكرتير العيادة</option>
            <option value="doctor">الطبيب</option>
        </select>
        <label>كلمة المرور:</label>
        <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور">
        <button onclick="login()">تسجيل الدخول</button>
    </div>

    <!-- شاشة السكرتير (الرئيسية / الإضافة) -->
    <div id="secretaryScreen" class="card hidden">
        
        <button onclick="openReviewScreen()" style="background-color: var(--success);">📅 سجل الحجوزات (مراجعة وتعديل)</button>
        <hr style="border-color: #334155; margin: 20px 0;">

        <!-- 🎙️ صندوق الذكاء الاصطناعي الصوتي -->
        <div class="ai-box">
            <h3>✨ المساعد الصوتي الذكي</h3>
            <label style="font-size: 12px; margin-bottom:10px;">اضغط على المايكروفون وتحدث، أو اكتب التفاصيل يدوياً.</label>
            <textarea id="aiInput" rows="3" placeholder="مثال: احجز لأحمد علي باجر العصر بـ 4، رقمه 07812345678، مراجعة خيط"></textarea>
            
            <div class="flex-row">
                <button id="btnMic" onclick="startVoiceRecognition()" style="background-color: #EF4444; flex: 1;">🎙️ تحدث الآن</button>
                <button id="btnAi" onclick="analyzeWithAI()" style="background-color: var(--ai-color); flex: 2;">تحليل وتعبئة</button>
            </div>
        </div>

        <h2>الإدخال اليدوي / المراجعة</h2>
        <label>تاريخ الحجز:</label>
        <input type="date" id="resDate" required>
        
        <label>تسلسل الحجز:</label>
        <input type="number" id="resSeq" placeholder="مثال: 1" required>
        
        <label>وقت الحجز:</label>
        <input type="time" id="resTime" required>
        
        <label>اسم المريض:</label>
        <input type="text" id="resName" placeholder="الاسم الثلاثي" required>
        
        <label>رقم الهاتف (اختياري):</label>
        <input type="tel" id="resPhone" placeholder="077... (اختياري)">
        
        <label>حالة المريض (اختياري):</label>
        <input type="text" id="resStatus" placeholder="مثال: رفع خيط، استشارة...">
        
        <button onclick="saveBooking()" id="btnSave">حفظ الحجز في السحابة</button>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

    <!-- الشاشة الجديدة: سجل الحجوزات الشامل للسكرتير -->
    <div id="secretaryReviewScreen" class="card hidden">
        <h2>سجل الحجوزات الشامل</h2>
        
        <div class="doctor-date-picker">
            <label>اختر تاريخ العرض:</label>
            <input type="date" id="secReviewDateFilter" onchange="loadReviewBookings()">
        </div>
        
        <div id="reviewBookingsList"></div>
        
        <button onclick="showScreen('secretaryScreen')" style="background-color: var(--primary); margin-top: 20px;">➕ العودة لإضافة حجز</button>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

    <!-- شاشة الطبيب -->
    <div id="doctorScreen" class="card hidden">
        <h2>جدول المراجعين</h2>
        <div class="doctor-date-picker">
            <label>اختر تاريخ العرض:</label>
            <input type="date" id="doctorDateFilter" onchange="loadDoctorDashboard()">
        </div>
        <div id="bookingsList"></div>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

</div>

<!-- نافذة التعديل المنبثقة -->
<div id="editModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 style="color: var(--warning);">تعديل الحجز ✏️</h2>
        <input type="hidden" id="editKey">
        <input type="hidden" id="editDate">
        <label>اسم المريض:</label>
        <input type="text" id="editName">
        <label>رقم الهاتف (اختياري):</label>
        <input type="tel" id="editPhone">
        <label>التسلسل:</label>
        <input type="number" id="editSeq">
        <label>الوقت:</label>
        <input type="time" id="editTime">
        <label>الحالة (اختياري):</label>
        <input type="text" id="editStatus">
        <button onclick="saveEdit()" style="background-color: var(--warning); color: #000;">حفظ التعديلات</button>
        <button class="close-btn" onclick="closeEditModal()">إلغاء</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getDatabase, ref, push, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

    // 💡 ضع رابط الفايربيس الخاص بك هنا
    const firebaseConfig = {
      databaseURL: "https://myclinicsystem-f978f-default-rtdb.firebaseio.com/", 
      projectId: "myclinicsystem-f978f",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const CLINIC_CODE = "MyClinic_1";

    // ==========================================
    // 🎙️ تقنية التعرف على الصوت (Web Speech API)
    // ==========================================
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ar-IQ'; 
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = function() {
            const btnMic = document.getElementById('btnMic');
            btnMic.innerText = "🔴 جاري الاستماع...";
            btnMic.style.backgroundColor = "#B91C1C";
        };

        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            document.getElementById('aiInput').value = transcript;
            analyzeWithAI(); 
        };

        recognition.onerror = function(event) {
            alert("حدث خطأ في المايكروفون أو لم يتم إعطاء الصلاحية.");
            resetMicButton();
        };

        recognition.onend = function() { resetMicButton(); };
    }

    function resetMicButton() {
        const btnMic = document.getElementById('btnMic');
        btnMic.innerText = "🎙️ تحدث الآن";
        btnMic.style.backgroundColor = "#EF4444";
    }

    window.startVoiceRecognition = function() {
        if (!recognition) {
            alert("عذراً، متصفح هاتفك لا يدعم ميزة الإدخال الصوتي. يرجى استخدام متصفح جوجل كروم الحديث.");
            return;
        }
        recognition.start();
    }

    // ==========================================
    // 🤖 دالة تحليل البيانات (Google Gemini) - مع نظام كشف الأخطاء
    // ==========================================
    window.analyzeWithAI = async function() {
        const aiText = document.getElementById('aiInput').value;
        if (!aiText) { alert("الرجاء كتابة أو نطق تفاصيل الحجز أولاً!"); return; }

        const btnAi = document.getElementById('btnAi');
        btnAi.innerText = "جاري التحليل... ⏳"; btnAi.disabled = true;

        // ⚠️ ضع مفتاح جيميناي هنا بين علامتي التنصيص
        const GEMINI_API_KEY = "AIzaSyCq9hg5lr3vj4zuiJm2OqEnw1pDyNBd-XA";
        
        // التحقق من أنك قمت بوضع المفتاح
       // التحقق من أنك قمت بوضع المفتاح
        if (!GEMINI_API_KEY) {
            alert("❌ تنبيه: لم تقم بوضع مفتاح Google Gemini في الكود!");
            btnAi.innerText = "تحليل وتعبئة"; btnAi.disabled = false;
            return;
        }

       const todayStr = new Date().toISOString().split('T')[0];
        
        const systemPrompt = `أنت مساعد ذكي لسكرتير عيادة طبية في العراق. تاريخ اليوم هو: ${todayStr}.
        قم باستخراج بيانات الحجز من النص التالي. يجب أن ترجع النتيجة بصيغة JSON فقط، بدون أي نصوص أو شروحات إضافية وبدون علامات (\`\`\`json).
        الحقول المطلوبة بدقة:
        - "name": اسم المريض.
        - "phone": رقم الهاتف. إذا لم يذكر اجعله فارغاً "".
        - "date": التاريخ بصيغة YYYY-MM-DD. (إذا قيل "باجر" أو "غداً"، فهو اليوم التالي). إذا لم يذكر تاريخ، افترض أنه اليوم.
        - "time": الوقت بصيغة 24 ساعة (مثلاً الساعة 4 العصر تُكتب "16:00"). إذا لم يذكر اجعله فارغاً "".
        - "status": سبب المراجعة (مثلاً: مراجعة خيط، سونار، استشارة). إذا لم يذكر اجعله فارغاً "".
        - "sequence": رقم التسلسل، إذا ذكره كـرقم صريح (مثلاً: تسلسله 5). إذا لم يذكر اجعله فارغاً "".
        النص هو: "${aiText}"`;

        try {
            // تم تصحيح الرابط للعمل مع الموديل الحديث (gemini-1.5-flash)
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    contents: [{ 
                        parts: [{ text: systemPrompt }] 
                    }] 
                })
            });

            if (!response.ok) {
                let errorMsg = `خطأ في الاتصال (Code: ${response.status})`;
                try {
                    const errorData = await response.json();
                    if (errorData.error && errorData.error.message) {
                        errorMsg = "❌ خطأ من جوجل: " + errorData.error.message;
                    }
                } catch(e) {}
                alert(errorMsg);
                btnAi.innerText = "تحليل وتعبئة"; btnAi.disabled = false;
                return;
            }

            const data = await response.json();
            
            if(data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                let aiResultText = data.candidates[0].content.parts[0].text.trim();
                aiResultText = aiResultText.replace(/```json/g, "").replace(/```/g, "").trim();
                
                try {
                    const parsed = JSON.parse(aiResultText);

                    if(parsed.name) document.getElementById('resName').value = parsed.name;
                    if(parsed.phone !== undefined) document.getElementById('resPhone').value = parsed.phone;
                    if(parsed.date) document.getElementById('resDate').value = parsed.date;
                    if(parsed.time) document.getElementById('resTime').value = parsed.time;
                    if(parsed.status !== undefined) document.getElementById('resStatus').value = parsed.status;
                    if(parsed.sequence) document.getElementById('resSeq').value = parsed.sequence;
                    
                    document.getElementById('aiInput').value = ''; 
                    alert("✨ تم تحليل النص وتعبئة الحقول بنجاح!");
                } catch (parseError) {
                    alert("❌ خطأ: استجاب الذكاء الاصطناعي بنص غير مفهوم:\n" + aiResultText);
                }
            } else {
                 alert("❌ خطأ: لم يرجع الذكاء الاصطناعي أي نتيجة صالحة.");
            }
        } catch (error) { 
            alert("❌ حدث خطأ في الاتصال: " + error.message); 
        }
        
        btnAi.innerText = "تحليل وتعبئة"; btnAi.disabled = false;
    }
    // ==========================================
    // بقية دوال التطبيق
    // ==========================================
    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('resDate').value = today;
        document.getElementById('doctorDateFilter').value = today;
        document.getElementById('secReviewDateFilter').value = today;
        checkAutoLogin();
    }

    window.login = function() {
        const role = document.getElementById('roleSelect').value;
        const pass = document.getElementById('loginPassword').value;
        if (role === 'secretary' && pass === '1234') {
            localStorage.setItem('userRole', 'secretary');
            showScreen('secretaryScreen');
        } else if (role === 'doctor' && pass === '5678') {
            localStorage.setItem('userRole', 'doctor');
            showScreen('doctorScreen'); loadDoctorDashboard();
        } else { alert("كلمة المرور خاطئة!"); }
    }

    window.checkAutoLogin = function() {
        const role = localStorage.getItem('userRole');
        if(role === 'secretary') { showScreen('secretaryScreen'); }
        else if (role === 'doctor') { showScreen('doctorScreen'); loadDoctorDashboard(); }
    }

    window.logout = function() {
        localStorage.removeItem('userRole');
        document.getElementById('loginPassword').value = '';
        showScreen('loginScreen');
    }

    window.showScreen = function(screenId) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('secretaryScreen').classList.add('hidden');
        document.getElementById('secretaryReviewScreen').classList.add('hidden');
        document.getElementById('doctorScreen').classList.add('hidden');
        document.getElementById(screenId).classList.remove('hidden');
    }

    window.saveBooking = async function() {
        const rDate = document.getElementById('resDate').value;
        const rSeq = document.getElementById('resSeq').value;
        const rTime = document.getElementById('resTime').value;
        const rName = document.getElementById('resName').value;
        const rPhone = document.getElementById('resPhone').value; 
        const rStatus = document.getElementById('resStatus').value;

        if(!rDate || !rSeq || !rTime || !rName) { alert("يرجى تعبئة الحقول الأساسية!"); return; }

        const btn = document.getElementById('btnSave'); btn.innerText = "جاري التحقق..."; btn.disabled = true;

        try {
            const bookingsRef = ref(db, `Bookings/${CLINIC_CODE}/${rDate}`);
            const snapshot = await get(bookingsRef);
            let isConflict = false;
            if (snapshot.exists()) {
                const data = snapshot.val();
                for (let key in data) {
                    if (data[key].sequence == rSeq) { alert(`❌ التسلسل رقم ${rSeq} محجوز مسبقاً.`); isConflict = true; break; }
                    if (data[key].time == rTime) { alert(`❌ الوقت ${rTime} محجوز مسبقاً.`); isConflict = true; break; }
                }
            }

            if (!isConflict) {
                const newBooking = {
                    sequence: parseInt(rSeq), time: rTime, patientName: rName, 
                    phone: rPhone || "", patientStatus: rStatus || "", syncState: "Pending", timestamp: new Date().getTime()
                };
                await push(bookingsRef, newBooking);
                alert("✅ تم حفظ الحجز بنجاح!");
                document.getElementById('resName').value = ''; document.getElementById('resPhone').value = '';
                document.getElementById('resStatus').value = ''; document.getElementById('resSeq').value = parseInt(rSeq) + 1;
            }
        } catch (error) { alert("حدث خطأ في الاتصال: " + error.message); }
        btn.innerText = "حفظ الحجز في السحابة"; btn.disabled = false;
    }

    window.openReviewScreen = function() {
        showScreen('secretaryReviewScreen');
        if (!document.getElementById('secReviewDateFilter').value) {
            document.getElementById('secReviewDateFilter').value = new Date().toISOString().split('T')[0];
        }
        loadReviewBookings();
    }

    window.loadReviewBookings = function() {
        const selectedDate = document.getElementById('secReviewDateFilter').value;
        if(!selectedDate) return;

        onValue(ref(db, `Bookings/${CLINIC_CODE}/${selectedDate}`), (snapshot) => {
            const listDiv = document.getElementById('reviewBookingsList'); listDiv.innerHTML = ''; 
            if (snapshot.exists()) {
                const data = snapshot.val();
                const bookingsArray = [];
                for(let key in data) { let b = data[key]; b.firebaseKey = key; bookingsArray.push(b); }
                bookingsArray.sort((a, b) => a.sequence - b.sequence);
                bookingsArray.forEach(b => {
                    const statusText = b.patientStatus ? `<div class="status-badge">📌 ${b.patientStatus}</div>` : '';
                    const phoneText = b.phone ? `<div>📱 الهاتف: ${b.phone}</div>` : '';
                    const editParams = `'${b.firebaseKey}', '${selectedDate}', '${b.patientName.replace(/'/g,"\\'")}', '${b.phone || ""}', '${b.sequence}', '${b.time}', '${b.patientStatus ? b.patientStatus.replace(/'/g,"\\'") : ""}'`;
                    
                    listDiv.innerHTML += `
                    <div class="booking-card" style="border-right-color: #10B981;">
                        <div class="seq">تسلسل: ${b.sequence}</div>
                        <div>👤 المريض: ${b.patientName}</div>
                        <div>🕒 الوقت: ${b.time}</div>
                        ${phoneText}
                        ${statusText}
                        <button class="edit-btn" onclick="openEditModal(${editParams})">✏️ تعديل الحجز</button>
                    </div>`;
                });
            } else { listDiv.innerHTML = `<div style="text-align:center; color:#94A3B8; padding:20px;">لا توجد حجوزات في تاريخ ${selectedDate}</div>`; }
        });
    }

    window.openEditModal = function(key, date, name, phone, seq, time, status) {
        document.getElementById('editKey').value = key; 
        document.getElementById('editDate').value = date; 
        document.getElementById('editName').value = name; 
        document.getElementById('editPhone').value = phone;
        document.getElementById('editSeq').value = seq; 
        document.getElementById('editTime').value = time;
        document.getElementById('editStatus').value = status; 
        document.getElementById('editModal').classList.remove('hidden');
    }

    window.closeEditModal = function() { document.getElementById('editModal').classList.add('hidden'); }

    window.saveEdit = async function() {
        const key = document.getElementById('editKey').value; 
        const date = document.getElementById('editDate').value;
        const updatedData = {
            patientName: document.getElementById('editName').value, 
            phone: document.getElementById('editPhone').value || "", 
            sequence: parseInt(document.getElementById('editSeq').value), 
            time: document.getElementById('editTime').value,
            patientStatus: document.getElementById('editStatus').value, 
            syncState: "Pending"
        };
        try {
            await update(ref(db, `Bookings/${CLINIC_CODE}/${date}/${key}`), updatedData);
            alert("تم تحديث بيانات الحجز بنجاح!"); closeEditModal();
        } catch (error) { alert("حدث خطأ أثناء التعديل: " + error.message); }
    }

    window.loadDoctorDashboard = function() {
        const selectedDate = document.getElementById('doctorDateFilter').value;
        if(!selectedDate) return;
        onValue(ref(db, `Bookings/${CLINIC_CODE}/${selectedDate}`), (snapshot) => {
            const listDiv = document.getElementById('bookingsList'); listDiv.innerHTML = ''; 
            if (snapshot.exists()) {
                const data = snapshot.val(); const bookingsArray = [];
                for(let key in data) { bookingsArray.push(data[key]); }
                bookingsArray.sort((a, b) => a.sequence - b.sequence);
                bookingsArray.forEach(b => {
                    const statusHtml = b.patientStatus ? `<div class="status-badge">📌 ملاحظة: ${b.patientStatus}</div>` : '';
                    const phoneHtml = b.phone ? `<div>📱 الهاتف: ${b.phone}</div>` : ''; 
                    listDiv.innerHTML += `
                    <div class="booking-card">
                        <div class="seq">تسلسل: ${b.sequence}</div>
                        <div>👤 المريض: ${b.patientName}</div>
                        <div>🕒 الوقت: ${b.time}</div>
                        ${phoneHtml}
                        ${statusHtml}
                    </div>`;
                });
            } else { listDiv.innerHTML = `<div style="text-align:center; color:#94A3B8; padding:20px;">لا توجد حجوزات في تاريخ ${selectedDate}</div>`; }
        });
    }
</script>
</body>
</html>
