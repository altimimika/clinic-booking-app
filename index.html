<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام إدارة العيادة الذكي</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #2196F3; --bg-color: #0F172A; --card-bg: #1E293B;
            --text-main: #F8FAFC; --text-muted: #94A3B8; --warning: #F59E0B; --success: #10B981; --danger: #EF4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 20px; box-sizing: border-box;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card {
            background-color: var(--card-bg); border-radius: 15px;
            padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 20px; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h2 { text-align: center; color: var(--primary); margin-top: 0; }
        
        .logo-placeholder {
            width: 80px; height: 80px; background: var(--primary); 
            border-radius: 50%; margin: 0 auto 20px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 35px; box-shadow: 0 0 20px rgba(33, 150, 243, 0.4);
        }
        
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-muted); font-size: 14px;}
        input, select, textarea {
            width: 100%; padding: 12px; margin-bottom: 18px;
            border: 1px solid #334155; border-radius: 8px;
            background-color: #0F172A; color: white; font-size: 16px;
            box-sizing: border-box; transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; }
        
        button {
            width: 100%; padding: 14px; background-color: var(--primary);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px;
        }
        button:active { transform: scale(0.98); }
        button.logout-btn { background-color: #334155; margin-top: 15px; }
        
        .doctor-tabs {
            display: flex; gap: 10px; margin-bottom: 20px; background: #0F172A; padding: 5px; border-radius: 10px;
        }
        .tab-btn {
            flex: 1; padding: 10px; background: transparent; border: none; border-radius: 8px;
            color: var(--text-muted); font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.3s; margin: 0;
        }
        .tab-btn.active {
            background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(33, 150, 243, 0.3);
        }

        .patient-actions {
            display: flex; gap: 8px; margin-top: 12px; border-top: 1px solid #334155; padding-top: 10px;
        }
        .action-icon-btn {
            flex: 1; padding: 8px; border: none; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; color: white; margin: 0;
        }
        .btn-call { background-color: var(--success); }
        .btn-edit { background-color: var(--warning); color: #000; }
        .btn-delete { background-color: var(--danger); }
        
        .booking-card {
            background: #0F172A; border-right: 4px solid var(--primary);
            padding: 15px; border-radius: 8px; margin-bottom: 12px;
        }
        .booking-card .seq { color: var(--primary); font-size: 18px; font-weight: bold; margin-bottom: 5px;}
        .status-badge {
            display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-top: 5px; font-weight: bold; color: white;
        }
        
        .records-counter {
            background: #1e293b; border: 1px solid #334155; padding: 10px 15px;
            border-radius: 8px; margin-bottom: 15px; font-weight: bold; text-align: center;
            color: var(--success); font-size: 15px;
        }

        .queue-stats-header {
            display: flex; gap: 12px; margin-bottom: 20px;
        }
        .queue-stat-box {
            flex: 1; background: #0F172A; padding: 14px;
            border-radius: 10px; text-align: center; font-weight: bold; font-size: 16px;
        }
        .neon-records {
            border: 2px solid var(--warning);
            color: var(--warning);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4), inset 0 0 8px rgba(245, 158, 11, 0.1);
        }
        .neon-money {
            border: 2px solid var(--success);
            color: var(--success);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4), inset 0 0 8px rgba(16, 185, 129, 0.1);
        }

        .hidden { display: none !important; }
        
        .doctor-date-picker {
            display: flex; align-items: center; justify-content: space-between;
            background: #0F172A; padding: 10px; border-radius: 8px; margin-bottom: 15px;
        }
        .doctor-date-picker label { margin-bottom: 0; color: var(--primary); }
        .doctor-date-picker input, .doctor-date-picker select { width: auto; margin-bottom: 0; padding: 8px; border: none; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="card">
        <div class="logo-placeholder">⚕</div>
        <h2>نظام العيادة الذكي</h2>
        
        <label>رمز العيادة (Clinic Code):</label>
        <input type="text" id="loginClinicCode" placeholder="أدخل رمز العيادة الخاص بك">

        <label>اسم المستخدم:</label>
        <input type="text" id="loginUsername" placeholder="أدخل اسم المستخدم">
        
        <label>كلمة المرور:</label>
        <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور">
        
        <button id="btnLogin" onclick="login()">تسجيل الدخول</button>
    </div>

    <!-- شاشة السكرتير أو الإدارة -->
    <div id="secretaryScreen" class="card hidden">
        <div id="welcomeSec" style="color: var(--success); font-weight: bold; margin-bottom: 15px; text-align: center;"></div>
        
        <button onclick="showScreen('secretaryReviewScreen'); loadReviewBookings();" style="background-color: var(--success);">📅 سجل الحجوزات (مراجعة وتعديل)</button>
        <hr style="border-color: #334155; margin: 20px 0;">

        <label>اختر الطبيب المعالج:</label>
        <select id="secretaryDoctorSelect" required>
            <option value="">جاري تحميل الأطباء...</option>
        </select>

        <h2 id="formTitle">إدخال الحجز</h2>
        <input type="hidden" id="editBookingKey" value="">

        <label>تاريخ الحجز:</label>
        <input type="date" id="resDate" required>
        
        <label>تسلسل الحجز:</label>
        <input type="number" id="resSeq" placeholder="مثال: 1" required>
        
        <label>وقت الحجز:</label>
        <input type="time" id="resTime" required>
        
        <label>اسم المريض:</label>
        <input type="text" id="resName" placeholder="الاسم الثلاثي" required>
        
        <label>رقم الهاتف:</label>
        <input type="tel" id="resPhone" placeholder="077...">
        
        <label>ملاحظات الحجز:</label>
        <input type="text" id="resNotes" placeholder="ملاحظات...">
        
        <button onclick="saveBooking()" id="btnSave">حفظ الحجز في السحابة</button>
        <button id="btnCancelEdit" class="hidden" onclick="cancelEditMode()" style="background-color: #64748B;">إلغاء التعديل</button>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

    <!-- شاشة سجل الحجوزات للسكرتير -->
    <div id="secretaryReviewScreen" class="card hidden">
        <h2>سجل الحجوزات الشامل</h2>
        <label>اختر الطبيب:</label>
        <select id="reviewDoctorSelect" onchange="loadReviewBookings()">
            <option value="">اختر الطبيب لعرض السجل...</option>
        </select>
        <div class="doctor-date-picker">
            <label>اختر التاريخ:</label>
            <input type="date" id="secReviewDateFilter" onchange="loadReviewBookings()">
        </div>
        <input type="text" id="secSearchInput" placeholder="🔍 ابحث بالاسم، التسلسل..." oninput="filterSecretaryBookings()">
        <div id="secretaryCounter" class="records-counter">📊 إجمالي الحجوزات: 0</div>
        <div id="reviewBookingsList"></div>
        <button onclick="showScreen('secretaryScreen')" style="background-color: var(--primary); margin-top: 20px;">➕ العودة لشاشة الحجز</button>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

    <!-- شاشة الطبيب -->
    <div id="doctorScreen" class="card hidden">
        <div id="welcomeDoc" style="color: var(--primary); font-weight: bold; margin-bottom: 10px; text-align: center;"></div>
        
        <div class="doctor-tabs">
            <button id="tabBookingsBtn" class="tab-btn active" onclick="switchDoctorTab('bookings')">📅 الحجوزات</button>
            <button id="tabQueueBtn" class="tab-btn" onclick="switchDoctorTab('queue')">🩺 طابور العيادة الحالي</button>
        </div>

        <div id="doctorBookingsTabContent">
            <h2>جدول المراجعين</h2>
            <div class="doctor-date-picker">
                <label>اختر تاريخ العرض:</label>
                <input type="date" id="doctorDateFilter" onchange="loadDoctorDashboard()">
            </div>
            <input type="text" id="docSearchInput" placeholder="🔍 ابحث بالاسم، التسلسل، الحالة..." oninput="filterDoctorBookings()">
            <div id="doctorCounter" class="records-counter">📊 إجمالي المراجعين: 0</div>
            <div id="bookingsList"></div>
        </div>

        <div id="doctorQueueTabContent" class="hidden">
            <h2>طابور العيادة الحالي</h2>
            <div class="queue-stats-header">
                <div id="queueCountBox" class="queue-stat-box neon-records">السجلات: 0</div>
                <div id="queueTotalBox" class="queue-stat-box neon-money">المبالغ: 0 د.ع</div>
            </div>
            <div id="queueList"></div>
        </div>

        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

</div>

<!-- نافذة منبثقة لتعديل الحجز مباشرة للطبيب -->
<div id="doctorEditCard" class="card hidden" style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 450px; z-index: 9999; border: 2px solid var(--primary);">
    <h2>تعديل بيانات الحجز</h2>
    <input type="hidden" id="docEditKey" value="">
    
    <label>التاريخ:</label>
    <input type="date" id="docEditDate">

    <label>التسلسل:</label>
    <input type="number" id="docEditSeq">

    <label>الوقت:</label>
    <input type="time" id="docEditTime">

    <label>اسم المريض:</label>
    <input type="text" id="docEditName">

    <label>رقم الهاتف:</label>
    <input type="tel" id="docEditPhone">

    <label>ملاحظات:</label>
    <input type="text" id="docEditNotes">

    <button onclick="saveDoctorBookingEdit()" style="background-color: var(--success);">💾 حفظ التعديلات</button>
    <button onclick="closeDoctorEditModal()" style="background-color: var(--danger);">إلغاء التعديل</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getDatabase, ref, push, update, get, remove, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://myclinicsystem-f978f-default-rtdb.firebaseio.com/", 
      projectId: "myclinicsystem-f978f",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let CLINIC_CODE = localStorage.getItem('clinicCode') || "";
    let doctorAllBookings = [];
    let clinicDoctorsList = {};

    function formatTimeTo12Hour(timeStr) {
        if (!timeStr) return "---";
        let cleanTime = timeStr.trim();
        
        if (/^\d{2}:\d{2}$/.test(cleanTime)) {
            let parts = cleanTime.split(':');
            let hours = parseInt(parts[0], 10);
            let minutes = parts[1];
            let period = hours >= 12 ? 'م' : 'ص';
            hours = hours % 12;
            hours = hours ? hours : 12;
            return `${hours}:${minutes} ${period}`;
        }

        let parts = cleanTime.split(' ');
        let timePart = parts[0]; 
        let periodPart = parts[1] || ''; 

        let timeSegments = timePart.split(':');
        if (timeSegments.length >= 2) {
            let hours = parseInt(timeSegments[0], 10);
            let minutes = timeSegments[1];
            
            if (!periodPart) {
                periodPart = hours >= 12 ? 'م' : 'ص';
                hours = hours % 12;
                hours = hours ? hours : 12;
            }
            return `${hours}:${minutes} ${periodPart}`;
        }
        return cleanTime;
    }

    window.login = async function() {
        const clinicCodeInput = document.getElementById('loginClinicCode').value.trim();
        const uInput = document.getElementById('loginUsername').value.trim();
        const pInput = document.getElementById('loginPassword').value.trim();

        if (!clinicCodeInput || !uInput || !pInput) {
            alert("يرجى إدخال رمز العيادة، اسم المستخدم وكلمة المرور!");
            return;
        }

        try {
            const snapshot = await get(ref(db, `DoctorsConfig/${clinicCodeInput}`));
            if (snapshot.exists()) {
                const users = snapshot.val();
                let foundUser = null;
                for (let key in users) {
                    if (users[key].Username === uInput && users[key].Password === pInput) {
                        foundUser = users[key]; 
                        break;
                    }
                }
                if (foundUser) {
                    localStorage.setItem('clinicCode', clinicCodeInput);
                    CLINIC_CODE = clinicCodeInput;
                    localStorage.setItem('userRole', foundUser.Role);
                    localStorage.setItem('userFullName', foundUser.FullName);
                    localStorage.setItem('doctorId', foundUser.DoctorID);

                    const role = (foundUser.Role || "").trim().toLowerCase();
                    if (role.includes("طبيب") || role.includes("doctor")) {
                        document.getElementById('welcomeDoc').innerText = `أهلاً بك، د. ${foundUser.FullName} 🩺`;
                        showScreen('doctorScreen'); 
                        loadDoctorDashboard();
                    } else {
                        document.getElementById('welcomeSec').innerText = `أهلاً بك، ${foundUser.FullName} (سكرتارية) 📋`;
                        showScreen('secretaryScreen'); 
                        loadDoctorsListForSecretary(users);
                    }
                } else { alert("❌ بيانات الدخول غير صحيحة!"); }
            } else { alert("❌ رمز العيادة غير صحيح!"); }
        } catch (error) { alert("خطأ في الاتصال: " + error.message); }
    }

    window.checkAutoLogin = async function() {
        const role = localStorage.getItem('userRole');
        const fullName = localStorage.getItem('userFullName');
        CLINIC_CODE = localStorage.getItem('clinicCode') || "";

        if (CLINIC_CODE) document.getElementById('loginClinicCode').value = CLINIC_CODE;
        if (!role) return;

        try {
            const snapshot = await get(ref(db, `DoctorsConfig/${CLINIC_CODE}`));
            const users = snapshot.exists() ? snapshot.val() : null;
            if (users) clinicDoctorsList = users;

            const userRoleLower = role.trim().toLowerCase();
            if(userRoleLower.includes('طبيب') || userRoleLower.includes('doctor')) { 
                document.getElementById('welcomeDoc').innerText = `أهلاً بك، د. ${fullName} 🩺`;
                showScreen('doctorScreen'); 
                loadDoctorDashboard(); 
            } else {
                document.getElementById('welcomeSec').innerText = `أهلاً بك، ${fullName} (سكرتارية) 📋`;
                showScreen('secretaryScreen');
                if (users) loadDoctorsListForSecretary(users);
            }
        } catch (e) {
            console.error("Auto login error:", e);
        }
    }

    window.loadDoctorsListForSecretary = function(usersObj) {
        clinicDoctorsList = usersObj;
        const secSelect = document.getElementById('secretaryDoctorSelect');
        const reviewSelect = document.getElementById('reviewDoctorSelect');
        
        secSelect.innerHTML = '<option value="">اختر الطبيب المعالج...</option>';
        reviewSelect.innerHTML = '<option value="">اختر الطبيب لعرض السجل...</option>';

        for (let key in usersObj) {
            let user = usersObj[key];
            let role = (user.Role || "").trim().toLowerCase();
            
            if (role.includes("طبيب") || role.includes("doctor")) {
                secSelect.innerHTML += `<option value="${user.DoctorID}">${user.FullName}</option>`;
                reviewSelect.innerHTML += `<option value="${user.DoctorID}">${user.FullName}</option>`;
            }
        }
    }

    window.logout = function() {
        localStorage.clear();
        showScreen('loginScreen');
    }

    window.showScreen = function(screenId) {
        ['loginScreen', 'secretaryScreen', 'secretaryReviewScreen', 'doctorScreen'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
    }

    window.switchDoctorTab = function(tabName) {
        const bookingsTab = document.getElementById('doctorBookingsTabContent');
        const queueTab = document.getElementById('doctorQueueTabContent');
        const bookingsBtn = document.getElementById('tabBookingsBtn');
        const queueBtn = document.getElementById('tabQueueBtn');

        if (tabName === 'bookings') {
            bookingsTab.classList.remove('hidden');
            queueTab.classList.add('hidden');
            bookingsBtn.classList.add('active');
            queueBtn.classList.remove('active');
        } else {
            bookingsTab.classList.add('hidden');
            queueTab.classList.remove('hidden');
            bookingsBtn.classList.remove('active');
            queueBtn.classList.add('active');
            loadDoctorQueue();
        }
    }

    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('doctorDateFilter').value = today;
        document.getElementById('secReviewDateFilter').value = today;
        document.getElementById('resDate').value = today;
        checkAutoLogin();
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered Successfully'))
                .catch((err) => console.log('Service Worker Registration Failed', err));
        }
    }

    window.loadDoctorDashboard = function() {
        const selectedDate = document.getElementById('doctorDateFilter').value;
        const docId = localStorage.getItem('doctorId');
        if(!selectedDate || !docId) return;

        onValue(ref(db, `Bookings/${CLINIC_CODE}/${docId}/${selectedDate}`), (snapshot) => {
            doctorAllBookings = [];
            if (snapshot.exists()) {
                const data = snapshot.val();
                for(let k in data) doctorAllBookings.push({ id: k, ...data[k] });
                doctorAllBookings.sort((a, b) => (parseInt(a.sequence) || 0) - (parseInt(b.sequence) || 0));
            }
            filterDoctorBookings();
        });
    }

    window.filterDoctorBookings = function() {
        const query = document.getElementById('docSearchInput').value.toLowerCase().trim();
        const listDiv = document.getElementById('bookingsList');
        const counterDiv = document.getElementById('doctorCounter');

        let filtered = doctorAllBookings.filter(b => {
            const nameMatch = b.patientName && b.patientName.toLowerCase().includes(query);
            const statusMatch = b.patientStatus && b.patientStatus.toLowerCase().includes(query);
            return !query || nameMatch || statusMatch;
        });

        counterDiv.innerText = `📊 إجمالي المراجعين: ${filtered.length}`;
        listDiv.innerHTML = '';

        filtered.forEach(b => {
            let statusText = b.patientStatus || "قيد الانتظار";
            let statusBg = "#334155"; 
            if (statusText === "حاضر") statusBg = "#10B981";        
            else if (statusText === "لم يحضر") statusBg = "#F59E0B"; 
            else if (statusText === "تم الالغاء") statusBg = "#EF4444"; 

            let phoneNum = b.patientPhone || b.phone || '';
            let phoneBtnHtml = phoneNum ? `<button class="action-icon-btn btn-call" onclick="callPatient('${phoneNum}')">📞 اتصال</button>` : '';
            let formattedTime = formatTimeTo12Hour(b.time); 

            listDiv.innerHTML += `
            <div class="booking-card" style="border-right-color: ${statusBg};">
                <div class="seq">تسلسل: ${b.sequence || '---'}</div>
                <div>👤 المريض: ${b.patientName || 'بدون اسم'}</div>
                <div>🕒 الوقت: ${formattedTime} | 📱 الهاتف: ${phoneNum || 'لا يوجد'}</div>
                <div class="status-badge" style="background-color: ${statusBg};">📌 الحالة: ${statusText}</div>
                ${b.patientNotes ? `<div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">💬 ملاحظات: ${b.patientNotes}</div>` : ''}
                
                <div class="patient-actions">
                    ${phoneBtnHtml}
                    <button class="action-icon-btn btn-edit" onclick="openDoctorEditModal('${b.id}', '${b.sequence || ''}', '${b.time || ''}', '${b.patientName || ''}', '${phoneNum}', '${b.patientNotes || ''}')">✏️ تعديل</button>
                    <button class="action-icon-btn btn-delete" onclick="deleteBookingFromDoctor('${b.id}')">🗑️ حذف</button>
                </div>
            </div>`;
        });
    }

    window.openDoctorEditModal = function(id, seq, time, name, phone, notes) {
        document.getElementById('docEditKey').value = id;
        document.getElementById('docEditDate').value = document.getElementById('doctorDateFilter').value;
        document.getElementById('docEditSeq').value = seq;
        document.getElementById('docEditName').value = name;
        document.getElementById('docEditPhone').value = phone;
        document.getElementById('docEditNotes').value = notes;

        let timeInputVal = "";
        if (time) {
            let match = time.match(/(\d+):(\d+)\s*(ص|م|AM|PM)?/i);
            if (match) {
                let h = parseInt(match[1], 10);
                let m = match[2];
                let p = (match[3] || "").toLowerCase();
                if ((p.includes('م') || p.includes('pm')) && h < 12) h += 12;
                if ((p.includes('ص') || p.includes('am')) && h === 12) h = 0;
                timeInputVal = `${String(h).padStart(2, '0')}:${m}`;
            } else {
                timeInputVal = time;
            }
        }
        document.getElementById('docEditTime').value = timeInputVal;
        document.getElementById('doctorEditCard').classList.remove('hidden');
    }

    window.closeDoctorEditModal = function() {
        document.getElementById('doctorEditCard').classList.add('hidden');
        showScreen('doctorScreen'); 
    }

    window.saveDoctorBookingEdit = async function() {
        const docId = localStorage.getItem('doctorId');
        const editKey = document.getElementById('docEditKey').value;
        const date = document.getElementById('docEditDate').value;
        const seq = document.getElementById('docEditSeq').value.trim();
        const rawTime = document.getElementById('docEditTime').value;
        const time = formatTimeTo12Hour(rawTime);
        const name = document.getElementById('docEditName').value.trim();
        const phone = document.getElementById('docEditPhone').value.trim();
        const notes = document.getElementById('docEditNotes').value.trim();

        if(!docId || !date || !seq || !rawTime || !name) {
            alert("يرجى ملء الحقول الإجبارية!");
            return;
        }

        try {
            // 🛡️ التحقق من عدم تكرار تسلسل الحجز لنفس التاريخ للطبيب أثناء التعديل
            const dateSnapshot = await get(ref(db, `Bookings/${CLINIC_CODE}/${docId}/${date}`));
            if (dateSnapshot.exists()) {
                const bookingsData = dateSnapshot.val();
                for (let key in bookingsData) {
                    if (String(bookingsData[key].sequence) === String(seq) && key !== editKey) {
                        alert(`❌ خطأ: رقم التسلسل (${seq}) محجوز مسبقاً لهذا التاريخ!`);
                        return;
                    }
                }
            }

            const bookingData = {
                sequence: seq,
                time: time,
                patientName: name,
                phone: phone,         
                patientPhone: phone,  
                patientNotes: notes,
                timestamp: Date.now()
            };

            await update(ref(db, `Bookings/${CLINIC_CODE}/${docId}/${date}/${editKey}`), bookingData);
            alert("✅ تم تعديل الحجز بنجاح!");
            closeDoctorEditModal();
        } catch (e) {
            alert("خطأ أثناء التعديل: " + e.message);
        }
    }

    window.loadDoctorQueue = function() {
        const docId = localStorage.getItem('doctorId');
        if(!docId) return;

        onValue(ref(db, `ClinicQueue/${CLINIC_CODE}/${docId}`), (snapshot) => {
            const queueListDiv = document.getElementById('queueList');
            const totalBoxDiv = document.getElementById('queueTotalBox');
            const countBoxDiv = document.getElementById('queueCountBox');
            queueListDiv.innerHTML = '';
            
            let totalAmount = 0;
            let totalRecords = 0;

            if (snapshot.exists()) {
                const data = snapshot.val();
                let queueItems = [];
                for(let k in data) queueItems.push(data[k]);
                
                totalRecords = queueItems.length;

                queueItems.forEach(item => {
                    let price = parseFloat(item.payAmount) || 0;
                    totalAmount += price;

                    queueListDiv.innerHTML += `
                    <div class="booking-card" style="border-right-color: var(--success);">
                        <div class="seq">تسلسل الحجز: ${item.sequence || 'غير متوفر'}</div>
                        <div>👤 اسم المريض: ${item.patientName}</div>
                        <div>💰 المبلغ: ${price.toLocaleString()} د.ع</div>
                        <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">📋 تفاصيل الدفع: ${item.paymentDetails || 'كشفية عادية'}</div>
                    </div>`;
                });
            } else {
                queueListDiv.innerHTML = `<div style="text-align:center; color:#94A3B8; padding:20px;">لا يوجد مراجعين في الطابور حالياً.</div>`;
            }

            countBoxDiv.innerText = `السجلات: ${totalRecords}`;
            totalBoxDiv.innerText = `المبالغ: ${totalAmount.toLocaleString()} د.ع`;
        });
    }

    window.saveBooking = async function() {
        const docId = document.getElementById('secretaryDoctorSelect').value;
        const date = document.getElementById('resDate').value;
        const seq = document.getElementById('resSeq').value.trim();
        const rawTime = document.getElementById('resTime').value;
        const time = formatTimeTo12Hour(rawTime); 
        const name = document.getElementById('resName').value.trim();
        const phone = document.getElementById('resPhone').value.trim();
        const notes = document.getElementById('resNotes').value.trim();
        const editKey = document.getElementById('editBookingKey').value;

        if(!docId || !date || !seq || !rawTime || !name) {
            alert("يرجى ملء الحقول الإجبارية واختيار الطبيب!");
            return;
        }

        try {
            // 🛡️ التحقق من عدم تكرار تسلسل الحجز لنفس التاريخ للطبيب أثناء الإضافة أو التعديل من قبل السكرتير
            const dateSnapshot = await get(ref(db, `Bookings/${CLINIC_CODE}/${docId}/${date}`));
            if (dateSnapshot.exists()) {
                const bookingsData = dateSnapshot.val();
                for (let key in bookingsData) {
                    if (String(bookingsData[key].sequence) === String(seq) && key !== editKey) {
                        alert(`❌ خطأ: رقم التسلسل (${seq}) محجوز مسبقاً لهذا التاريخ! يرجى اختيار تسلسل آخر.`);
                        return;
                    }
                }
            }

            const bookingData = {
                sequence: seq,
                time: time, 
                patientName: name,
                phone: phone,          
                patientPhone: phone,  
                patientNotes: notes,
                patientStatus: "قيد الانتظار",
                timestamp: Date.now()
            };

            if (editKey) {
                await update(ref(db, `Bookings/${CLINIC_CODE}/${docId}/${date}/${editKey}`), bookingData);
                alert("✅ تم تحديث الحجز بنجاح!");
                cancelEditMode();
            } else {
                await push(ref(db, `Bookings/${CLINIC_CODE}/${docId}/${date}`), bookingData);
                alert("✅ تم حفظ الحجز بنجاح!");
                document.getElementById('resName').value = '';
                document.getElementById('resPhone').value = '';
                document.getElementById('resNotes').value = '';
                document.getElementById('resSeq').value = parseInt(seq) + 1;
            }
        } catch (e) {
            alert("خطأ أثناء الحفظ: " + e.message);
        }
    }

    window.loadReviewBookings = function() {
        const docId = document.getElementById('reviewDoctorSelect').value;
        const date = document.getElementById('secReviewDateFilter').value;
        if(!docId || !date) return;

        onValue(ref(db, `Bookings/${CLINIC_CODE}/${docId}/${date}`), (snapshot) => {
            window.reviewBookingsData = [];
            if(snapshot.exists()) {
                const data = snapshot.val();
                for(let k in data) {
                    window.reviewBookingsData.push({ id: k, ...data[k] });
                }
            }
            filterSecretaryBookings();
        });
    }

    window.filterSecretaryBookings = function() {
        const query = document.getElementById('secSearchInput').value.toLowerCase().trim();
        const listDiv = document.getElementById('reviewBookingsList');
        const counterDiv = document.getElementById('secretaryCounter');

        let filtered = (window.reviewBookingsData || []).filter(b => {
            return !query || (b.patientName && b.patientName.toLowerCase().includes(query)) || (b.sequence && b.sequence.toString().includes(query));
        });

        counterDiv.innerText = `📊 إجمالي الحجوزات: ${filtered.length}`;
        listDiv.innerHTML = '';

        filtered.forEach(b => {
            let phoneNum = b.patientPhone || b.phone || '';
            let phoneBtnHtml = phoneNum ? `<button class="action-icon-btn btn-call" onclick="callPatient('${phoneNum}')">📞 اتصال</button>` : '';
            let formattedTime = formatTimeTo12Hour(b.time); 
            let currentDocId = document.getElementById('reviewDoctorSelect').value;
            
            listDiv.innerHTML += `
            <div class="booking-card">
                <div class="seq">تسلسل: ${b.sequence} - ${b.patientName}</div>
                <div>🕒 الوقت: ${formattedTime} | 📱 الهاتف: ${phoneNum || 'لا يوجد'}</div>
                <div class="status-badge" style="background-color: #334155;">📌 الحالة: ${b.patientStatus || 'قيد الانتظار'}</div>
                ${b.patientNotes ? `<div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">💬 ملاحظات: ${b.patientNotes}</div>` : ''}
                
                <div class="patient-actions">
                    ${phoneBtnHtml}
                    <button class="action-icon-btn btn-edit" onclick="editBooking('${b.id}', '${b.sequence || ''}', '${b.time || ''}', '${b.patientName || ''}', '${phoneNum}', '${b.patientNotes || ''}', '${currentDocId}')">✏️ تعديل</button>
                    <button class="action-icon-btn btn-delete" onclick="deleteBooking('${b.id}')">🗑️ حذف</button>
                </div>
            </div>`;
        });
    }

    window.callPatient = function(phone) {
        window.location.href = `tel:${phone}`;
    }

    window.editBooking = function(id, seq, time, name, phone, notes, docId) {
        document.getElementById('editBookingKey').value = id;
        document.getElementById('resSeq').value = seq;
        document.getElementById('resName').value = name;
        document.getElementById('resPhone').value = phone;
        document.getElementById('resNotes').value = notes;
        
        if (docId) {
            document.getElementById('secretaryDoctorSelect').value = docId;
        }

        let timeInputVal = "";
        if (time) {
            let match = time.match(/(\d+):(\d+)\s*(ص|م|AM|PM)?/i);
            if (match) {
                let h = parseInt(match[1], 10);
                let m = match[2];
                let p = (match[3] || "").toLowerCase();
                if ((p.includes('م') || p.includes('pm')) && h < 12) h += 12;
                if ((p.includes('ص') || p.includes('am')) && h === 12) h = 0;
                timeInputVal = `${String(h).padStart(2, '0')}:${m}`;
            } else {
                timeInputVal = time;
            }
        }
        document.getElementById('resTime').value = timeInputVal;

        document.getElementById('formTitle').innerText = "تعديل بيانات الحجز";
        document.getElementById('btnSave').innerText = "حفظ التعديلات";
        document.getElementById('btnCancelEdit').classList.remove('hidden');

        showScreen('secretaryScreen');
    }

    window.cancelEditMode = function() {
        document.getElementById('editBookingKey').value = "";
        document.getElementById('resName').value = '';
        document.getElementById('resPhone').value = '';
        document.getElementById('resNotes').value = '';
        document.getElementById('formTitle').innerText = "إدخال الحجز";
        document.getElementById('btnSave').innerText = "حفظ الحجز في السحابة";
        document.getElementById('btnCancelEdit').classList.add('hidden');
    }

    window.deleteBooking = async function(bookingId) {
        if (!confirm("هل أنت متأكد من حذف هذا الحجز؟")) return;
        const docId = document.getElementById('reviewDoctorSelect').value;
        const date = document.getElementById('secReviewDateFilter').value;

        try {
            await remove(ref(db, `Bookings/${CLINIC_CODE}/${docId}/${date}/${bookingId}`));
            alert("🗑️ تم حذف الحجز بنجاح!");
        } catch (e) {
            alert("خطأ أثناء الحذف: " + e.message);
        }
    }

    window.deleteBookingFromDoctor = async function(bookingId) {
        if (!confirm("هل أنت متأكد من حذف هذا الحجز؟")) return;
        const docId = localStorage.getItem('doctorId');
        const date = document.getElementById('doctorDateFilter').value;

        try {
            await remove(ref(db, `Bookings/${CLINIC_CODE}/${docId}/${date}/${bookingId}`));
        } catch (e) {
            alert("خطأ أثناء الحذف: " + e.message);
        }
    }
</script>
