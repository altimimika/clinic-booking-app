<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام إدارة العيادة الذكي</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #2196F3; --bg-color: #0F172A; --card-bg: #1E293B;
            --text-main: #F8FAFC; --text-muted: #94A3B8; --warning: #F59E0B;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 20px; box-sizing: border-box;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card {
            background-color: var(--card-bg); border-radius: 15px;
            padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 20px; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h2 { text-align: center; color: var(--primary); margin-top: 0; }
        h3 { color: var(--primary); border-bottom: 1px solid #334155; padding-bottom: 10px; }
        
        .logo-placeholder {
            width: 80px; height: 80px; background: var(--primary); 
            border-radius: 50%; margin: 0 auto 20px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 35px; box-shadow: 0 0 20px rgba(33, 150, 243, 0.4);
        }
        
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-muted); font-size: 14px;}
        input, select {
            width: 100%; padding: 12px; margin-bottom: 18px;
            border: 1px solid #334155; border-radius: 8px;
            background-color: #0F172A; color: white; font-size: 16px;
            box-sizing: border-box; transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; }
        
        button {
            width: 100%; padding: 14px; background-color: var(--primary);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        button:active { transform: scale(0.98); }
        button.logout-btn { background-color: #334155; margin-top: 15px; }
        button.edit-btn { background-color: var(--warning); padding: 8px; width: auto; font-size: 14px; margin-top: 10px; }
        
        .booking-card {
            background: #0F172A; border-right: 4px solid var(--primary);
            padding: 15px; border-radius: 8px; margin-bottom: 12px; position: relative;
        }
        .booking-card .seq { color: var(--primary); font-size: 18px; font-weight: bold; margin-bottom: 5px;}
        .status-badge {
            display: inline-block; background-color: #334155; color: #F8FAFC;
            padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-top: 5px;
        }
        
        .hidden { display: none !important; }
        
        .doctor-date-picker {
            display: flex; align-items: center; justify-content: space-between;
            background: #0F172A; padding: 10px; border-radius: 8px; margin-bottom: 20px;
        }
        .doctor-date-picker label { margin-bottom: 0; color: var(--primary); }
        .doctor-date-picker input { width: auto; margin-bottom: 0; padding: 8px; border: none; }

        /* تصميم نافذة التعديل المنبثقة (Modal) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg); padding: 20px; border-radius: 15px;
            width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto;
        }
        .close-btn { background-color: #EF4444; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- 1. شاشة تسجيل الدخول -->
    <div id="loginScreen" class="card">
        <div class="logo-placeholder">⚕️</div>
        <h2>نظام العيادة الذكي</h2>
        <label>الدخول بصلاحية:</label>
        <select id="roleSelect">
            <option value="secretary">سكرتير العيادة</option>
            <option value="doctor">الطبيب</option>
        </select>
        <label>كلمة المرور:</label>
        <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور">
        <button onclick="login()">تسجيل الدخول</button>
    </div>

    <!-- 2. شاشة السكرتير -->
    <div id="secretaryScreen" class="card hidden">
        <h2>إضافة حجز جديد</h2>
        <!-- أضفنا onchange لتحديث القائمة السفلية عند تغيير التاريخ -->
        <label>تاريخ الحجز:</label>
        <input type="date" id="resDate" onchange="loadSecretaryBookings()" required>
        
        <label>تسلسل الحجز:</label>
        <input type="number" id="resSeq" placeholder="مثال: 1" required>
        
        <label>وقت الحجز:</label>
        <input type="time" id="resTime" required>
        
        <label>اسم المريض:</label>
        <input type="text" id="resName" placeholder="الاسم الثلاثي" required>
        
        <label>رقم الهاتف:</label>
        <input type="tel" id="resPhone" placeholder="077..." required>
        
        <label>حالة المريض / سبب المراجعة (اختياري):</label>
        <input type="text" id="resStatus" placeholder="مثال: رفع خيط، استشارة...">
        
        <button onclick="saveBooking()" id="btnSave">حفظ الحجز في السحابة</button>
        
        <!-- قسم عرض حجوزات اليوم للسكرتير -->
        <h3 style="margin-top: 30px;">📋 حجوزات هذا اليوم</h3>
        <div id="secBookingsList"></div>

        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

    <!-- 3. شاشة الطبيب -->
    <div id="doctorScreen" class="card hidden">
        <h2>جدول المراجعين</h2>
        <div class="doctor-date-picker">
            <label>اختر تاريخ العرض:</label>
            <input type="date" id="doctorDateFilter" onchange="loadDoctorDashboard()">
        </div>
        <div id="bookingsList"></div>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

</div>

<!-- 4. نافذة التعديل المنبثقة (مخفية افتراضياً) -->
<div id="editModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 style="color: var(--warning);">تعديل الحجز ✏️</h2>
        <input type="hidden" id="editKey">
        <input type="hidden" id="editDate"> <!-- للاحتفاظ بالتاريخ -->
        
        <label>اسم المريض:</label>
        <input type="text" id="editName">
        
        <label>رقم الهاتف:</label>
        <input type="tel" id="editPhone">
        
        <label>التسلسل:</label>
        <input type="number" id="editSeq">
        
        <label>الوقت:</label>
        <input type="time" id="editTime">

        <label>الحالة (اختياري):</label>
        <input type="text" id="editStatus">
        
        <button onclick="saveEdit()" style="background-color: var(--warning); color: #000;">حفظ التعديلات</button>
        <button class="close-btn" onclick="closeEditModal()">إلغاء</button>
    </div>
</div>

<script type="module">
    // أضفنا دالة update للتعديل على البيانات
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getDatabase, ref, push, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://myclinicsystem-f978f-default-rtdb.firebaseio.com/", 
      projectId: "myclinicsystem-f978f",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const CLINIC_CODE = "MyClinic_1";

    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('resDate').value = today;
        document.getElementById('doctorDateFilter').value = today;
        checkAutoLogin();
    }

    window.login = function() {
        const role = document.getElementById('roleSelect').value;
        const pass = document.getElementById('loginPassword').value;

        if (role === 'secretary' && pass === '1234') {
            localStorage.setItem('userRole', 'secretary');
            showScreen('secretaryScreen');
            loadSecretaryBookings(); // تحميل الأسماء للسكرتير
        } else if (role === 'doctor' && pass === '5678') {
            localStorage.setItem('userRole', 'doctor');
            showScreen('doctorScreen');
            loadDoctorDashboard();
        } else {
            alert("كلمة المرور خاطئة!");
        }
    }

    window.checkAutoLogin = function() {
        const role = localStorage.getItem('userRole');
        if(role === 'secretary') { showScreen('secretaryScreen'); loadSecretaryBookings(); }
        else if (role === 'doctor') { showScreen('doctorScreen'); loadDoctorDashboard(); }
    }

    window.logout = function() {
        localStorage.removeItem('userRole');
        document.getElementById('loginPassword').value = '';
        showScreen('loginScreen');
    }

    window.showScreen = function(screenId) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('secretaryScreen').classList.add('hidden');
        document.getElementById('doctorScreen').classList.add('hidden');
        document.getElementById(screenId).classList.remove('hidden');
    }

    // إضافة حجز
    window.saveBooking = async function() {
        const rDate = document.getElementById('resDate').value;
        const rSeq = document.getElementById('resSeq').value;
        const rTime = document.getElementById('resTime').value;
        const rName = document.getElementById('resName').value;
        const rPhone = document.getElementById('resPhone').value;
        const rStatus = document.getElementById('resStatus').value;

        if(!rDate || !rSeq || !rTime || !rName || !rPhone) {
            alert("يرجى تعبئة الحقول الأساسية!"); return;
        }

        const btn = document.getElementById('btnSave');
        btn.innerText = "جاري التحقق..."; btn.disabled = true;

        try {
            const bookingsRef = ref(db, `Bookings/${CLINIC_CODE}/${rDate}`);
            const snapshot = await get(bookingsRef);
            let isConflict = false;
            
            if (snapshot.exists()) {
                const data = snapshot.val();
                for (let key in data) {
                    if (data[key].sequence == rSeq) {
                        alert(`❌ التسلسل رقم ${rSeq} محجوز مسبقاً.`);
                        isConflict = true; break;
                    }
                    if (data[key].time == rTime) {
                        alert(`❌ الوقت ${rTime} محجوز مسبقاً.`);
                        isConflict = true; break;
                    }
                }
            }

            if (!isConflict) {
                const newBooking = {
                    sequence: parseInt(rSeq),
                    time: rTime,
                    patientName: rName,
                    phone: rPhone,
                    patientStatus: rStatus || "",
                    syncState: "Pending",
                    timestamp: new Date().getTime()
                };
                
                await push(bookingsRef, newBooking);
                alert("✅ تم حفظ الحجز بنجاح!");
                
                document.getElementById('resName').value = '';
                document.getElementById('resPhone').value = '';
                document.getElementById('resStatus').value = '';
                document.getElementById('resSeq').value = parseInt(rSeq) + 1;
            }
        } catch (error) {
            alert("حدث خطأ في الاتصال: " + error.message);
        }
        btn.innerText = "حفظ الحجز في السحابة"; btn.disabled = false;
    }

    // ==============================================================
    // دوال السكرتير الجديدة (عرض الحجوزات والتعديل)
    // ==============================================================
    
    // جلب حجوزات السكرتير
    window.loadSecretaryBookings = function() {
        const selectedDate = document.getElementById('resDate').value;
        if(!selectedDate) return;

        const bookingsRef = ref(db, `Bookings/${CLINIC_CODE}/${selectedDate}`);
        
        onValue(bookingsRef, (snapshot) => {
            const listDiv = document.getElementById('secBookingsList');
            listDiv.innerHTML = ''; 
            
            if (snapshot.exists()) {
                const data = snapshot.val();
                const bookingsArray = [];
                // نحتفظ بمفتاح (Key) الحجز لكي نستطيع تعديله لاحقاً
                for(let key in data) { 
                    let b = data[key];
                    b.firebaseKey = key; 
                    bookingsArray.push(b); 
                }
                
                bookingsArray.sort((a, b) => a.sequence - b.sequence);

                bookingsArray.forEach(b => {
                    const statusText = b.patientStatus ? ` - ${b.patientStatus}` : '';
                    // نمرر البيانات إلى دالة الفتح عند الضغط على القلم
                    const editParams = `'${b.firebaseKey}', '${b.patientName.replace(/'/g,"\\'")}', '${b.phone}', '${b.sequence}', '${b.time}', '${b.patientStatus ? b.patientStatus.replace(/'/g,"\\'") : ""}'`;
                    
                    listDiv.innerHTML += `
                    <div class="booking-card" style="border-right-color: #F59E0B;">
                        <div class="seq">تسلسل: ${b.sequence}</div>
                        <div>👤 ${b.patientName} ${statusText}</div>
                        <button class="edit-btn" onclick="openEditModal(${editParams})">✏️ تعديل الحجز</button>
                    </div>`;
                });
            } else {
                listDiv.innerHTML = `<div style="text-align:center; color:#94A3B8;">لا توجد حجوزات في هذا اليوم.</div>`;
            }
        });
    }

    // فتح نافذة التعديل وملء البيانات القديمة
    window.openEditModal = function(key, name, phone, seq, time, status) {
        document.getElementById('editKey').value = key;
        document.getElementById('editDate').value = document.getElementById('resDate').value;
        document.getElementById('editName').value = name;
        document.getElementById('editPhone').value = phone;
        document.getElementById('editSeq').value = seq;
        document.getElementById('editTime').value = time;
        document.getElementById('editStatus').value = status;
        
        document.getElementById('editModal').classList.remove('hidden');
    }

    // إغلاق النافذة
    window.closeEditModal = function() {
        document.getElementById('editModal').classList.add('hidden');
    }

    // حفظ التعديلات في Firebase
    window.saveEdit = async function() {
        const key = document.getElementById('editKey').value;
        const date = document.getElementById('editDate').value;
        
        const updatedData = {
            patientName: document.getElementById('editName').value,
            phone: document.getElementById('editPhone').value,
            sequence: parseInt(document.getElementById('editSeq').value),
            time: document.getElementById('editTime').value,
            patientStatus: document.getElementById('editStatus').value,
            syncState: "Pending" // نجعله Pending لكي يعاد سحبه وتحديثه في C#
        };

        try {
            const bookingRef = ref(db, `Bookings/${CLINIC_CODE}/${date}/${key}`);
            await update(bookingRef, updatedData);
            alert("تم تحديث بيانات الحجز بنجاح!");
            closeEditModal();
        } catch (error) {
            alert("حدث خطأ أثناء التعديل: " + error.message);
        }
    }

    // ==============================================================
    // دوال الطبيب (لم تتغير، فقط للتأكيد أن رقم الهاتف يظهر)
    // ==============================================================
    window.loadDoctorDashboard = function() {
        const selectedDate = document.getElementById('doctorDateFilter').value;
        if(!selectedDate) return;

        const bookingsRef = ref(db, `Bookings/${CLINIC_CODE}/${selectedDate}`);
        
        onValue(bookingsRef, (snapshot) => {
            const listDiv = document.getElementById('bookingsList');
            listDiv.innerHTML = ''; 
            
            if (snapshot.exists()) {
                const data = snapshot.val();
                const bookingsArray = [];
                for(let key in data) { bookingsArray.push(data[key]); }
                bookingsArray.sort((a, b) => a.sequence - b.sequence);

                bookingsArray.forEach(b => {
                    const statusHtml = b.patientStatus ? `<div class="status-badge">📌 ملاحظة: ${b.patientStatus}</div>` : '';
                    // لاحظ أن رقم الهاتف 📱 موجود ومتاح للطبيب
                    listDiv.innerHTML += `
                    <div class="booking-card">
                        <div class="seq">تسلسل: ${b.sequence}</div>
                        <div>👤 المريض: ${b.patientName}</div>
                        <div>🕒 الوقت: ${b.time}</div>
                        <div>📱 الهاتف: ${b.phone}</div>
                        ${statusHtml}
                    </div>`;
                });
            } else {
                listDiv.innerHTML = `<div style="text-align:center; color:#94A3B8; padding:20px;">لا توجد حجوزات في تاريخ ${selectedDate}</div>`;
            }
        });
    }
</script>
</body>
</html>
