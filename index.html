<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام إدارة العيادة الذكي</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #2196F3; --bg-color: #0F172A; --card-bg: #1E293B;
            --text-main: #F8FAFC; --text-muted: #94A3B8; --warning: #F59E0B; --ai-color: #8B5CF6; --success: #10B981;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            margin: 0; padding: 20px; box-sizing: border-box;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .card {
            background-color: var(--card-bg); border-radius: 15px;
            padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 20px; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        h2 { text-align: center; color: var(--primary); margin-top: 0; }
        h3 { color: var(--primary); border-bottom: 1px solid #334155; padding-bottom: 10px; }
        
        .logo-placeholder {
            width: 80px; height: 80px; background: var(--primary); 
            border-radius: 50%; margin: 0 auto 20px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 35px; box-shadow: 0 0 20px rgba(33, 150, 243, 0.4);
        }
        
        label { display: block; margin-bottom: 8px; font-weight: bold; color: var(--text-muted); font-size: 14px;}
        input, select, textarea {
            width: 100%; padding: 12px; margin-bottom: 18px;
            border: 1px solid #334155; border-radius: 8px;
            background-color: #0F172A; color: white; font-size: 16px;
            box-sizing: border-box; transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); outline: none; }
        
        button {
            width: 100%; padding: 14px; background-color: var(--primary);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px;
        }
        button:active { transform: scale(0.98); }
        button.logout-btn { background-color: #334155; margin-top: 15px; }
        
        /* أزرار الإجراءات داخل الكارد الخاص بالسكرتير */
        .action-buttons { display: flex; gap: 8px; margin-top: 10px; }
        button.edit-btn { background-color: var(--warning); padding: 8px; font-size: 14px; color: #000; margin: 0; flex: 1; border-radius: 6px; }
        button.delete-btn { background-color: #EF4444; padding: 8px; font-size: 14px; color: #FFF; margin: 0; flex: 1; border-radius: 6px; }
        
        /* 🩺 شكل بطاقة المراجع (بنلات مدورة الحواف حصرياً كما طلبت) */
        .booking-card {
            background: #0F172A; border-right: 4px solid var(--primary);
            padding: 16px; border-radius: 12px; margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .booking-card .seq { color: var(--primary); font-size: 18px; font-weight: bold; margin-bottom: 6px;}
        .status-badge {
            display: inline-block; background-color: #334155; color: #F8FAFC;
            padding: 4px 10px; border-radius: 6px; font-size: 12px; margin-top: 8px;
        }
        
        .records-counter {
            background: #1e293b; border: 1px solid #334155; padding: 10px 15px;
            border-radius: 8px; margin-bottom: 15px; font-weight: bold; text-align: center;
            color: var(--success); font-size: 15px;
        }

        .hidden { display: none !important; }
        
        .doctor-date-picker {
            display: flex; align-items: center; justify-content: space-between;
            background: #0F172A; padding: 10px; border-radius: 8px; margin-bottom: 15px;
        }
        .doctor-date-picker label { margin-bottom: 0; color: var(--primary); }
        .doctor-date-picker input, .doctor-date-picker select { width: auto; margin-bottom: 0; padding: 8px; border: none; }

        .ai-box {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid var(--ai-color); padding: 15px; border-radius: 12px;
            margin-bottom: 25px; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.2);
        }
        .ai-box h3 { color: var(--ai-color); border: none; padding: 0; margin-top: 0; margin-bottom: 15px; display: flex; align-items: center; gap: 8px;}
        
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg); padding: 20px; border-radius: 15px;
            width: 90%; max-width: 400px; max-height: 90vh; overflow-y: auto;
        }
        .close-btn { background-color: #EF4444; margin-top: 10px; }
        .flex-row { display: flex; gap: 10px; }
    </style>
</head>
<body>

<div class="container">
    
    <!-- شاشة تسجيل الدخول -->
    <div id="loginScreen" class="card">
        <div class="logo-placeholder">⚕️</div>
        <h2>نظام العيادة الذكي</h2>
        
        <label>اسم المستخدم:</label>
        <input type="text" id="loginUsername" placeholder="أدخل اسم المستخدم">
        
        <label>كلمة المرور:</label>
        <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور">
        
        <button id="btnLogin" onclick="login()">تسجيل الدخول</button>
    </div>

    <!-- شاشة السكرتير (الإضافة) -->
    <div id="secretaryScreen" class="card hidden">
        <div id="welcomeSec" style="color: var(--success); font-weight: bold; margin-bottom: 15px; text-align: center;"></div>
        
        <button onclick="openReviewScreen()" style="background-color: var(--success);">📅 سجل الحجوزات (مراجعة وتعديل)</button>
        <hr style="border-color: #334155; margin: 20px 0;">

        <label>اختر الطبيب المعالج:</label>
        <select id="secretaryDoctorSelect" required>
            <option value="">جاري تحميل الأطباء...</option>
        </select>

        <div class="ai-box">
            <h3>✨ المساعد الصوتي الذكي</h3>
            <label style="font-size: 12px; margin-bottom:10px;">اضغط على المايكروفون وتحدث، أو اكتب التفاصيل يدوياً.</label>
            <textarea id="aiInput" rows="3" placeholder="مثال: احجز لأحمد علي باجر العصر بـ 4، رقمه 07812345678، مراجعة خيط"></textarea>
            
            <div class="flex-row">
                <button id="btnMic" onclick="startVoiceRecognition()" style="background-color: #EF4444; flex: 1;">🎙️ تحدث الآن</button>
                <button id="btnAi" onclick="analyzeWithAI()" style="background-color: var(--ai-color); flex: 2;">تحليل وتعبئة</button>
            </div>
        </div>

        <h2>الإدخال اليدوي / المراجعة</h2>
        <label>تاريخ الحجز:</label>
        <input type="date" id="resDate" required>
        
        <label>تسلسل الحجز:</label>
        <input type="number" id="resSeq" placeholder="مثال: 1" required>
        
        <label>وقت الحجز:</label>
        <input type="time" id="resTime" required>
        
        <label>اسم المريض:</label>
        <input type="text" id="resName" placeholder="الاسم الثلاثي" required>
        
        <label>رقم الهاتف (اختياري):</label>
        <input type="tel" id="resPhone" placeholder="077... (اختياري)">
        
        <label>حالة المريض (اختياري):</label>
        <input type="text" id="resStatus" placeholder="مثال: رفع خيط، استشارة...">
        
        <button onclick="saveBooking()" id="btnSave">حفظ الحجز في السحابة</button>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

    <!-- شاشة سجل الحجوزات الشامل للسكرتير -->
    <div id="secretaryReviewScreen" class="card hidden">
        <h2>سجل الحجوزات الشامل</h2>
        
        <label>اختر الطبيب:</label>
        <select id="reviewDoctorSelect" onchange="loadReviewBookings()">
            <option value="">اختر الطبيب...</option>
        </select>

        <div class="doctor-date-picker">
            <label>اختر التاريخ:</label>
            <input type="date" id="secReviewDateFilter" onchange="loadReviewBookings()">
        </div>
        
        <div id="secretaryCounter" class="records-counter">📊 إجمالي الحجوزات: 0</div>

        <div id="reviewBookingsList"></div>
        
        <button onclick="showScreen('secretaryScreen')" style="background-color: var(--primary); margin-top: 20px;">➕ العودة لإضافة حجز</button>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

    <!-- شاشة الطبيب (بنلات مدورة الحواف تماماً كالطلب) -->
    <div id="doctorScreen" class="card hidden">
        <div id="welcomeDoc" style="color: var(--primary); font-weight: bold; margin-bottom: 15px; text-align: center;"></div>
        <h2>جدول المراجعين</h2>
        
        <div class="doctor-date-picker">
            <label>اختر تاريخ العرض:</label>
            <input type="date" id="doctorDateFilter" onchange="loadDoctorDashboard()">
        </div>
        
        <div id="doctorCounter" class="records-counter">📊 إجمالي المراجعين: 0</div>

        <div id="bookingsList"></div>
        <button class="logout-btn" onclick="logout()">تسجيل الخروج</button>
    </div>

</div>

<!-- نافذة التعديل المنبثقة -->
<div id="editModal" class="modal-overlay hidden">
    <div class="modal-content">
        <h2 style="color: var(--warning);">تعديل الحجز ✏️</h2>
        <input type="hidden" id="editKey">
        <input type="hidden" id="editDate">
        <input type="hidden" id="editDocId">
        <label>اسم المريض:</label>
        <input type="text" id="editName">
        <label>رقم الهاتف (اختياري):</label>
        <input type="tel" id="editPhone">
        <label>التسلسل:</label>
        <input type="number" id="editSeq">
        <label>الوقت:</label>
        <input type="time" id="editTime">
        <label>الحالة (اختياري):</label>
        <input type="text" id="editStatus">
        <button onclick="saveEdit()" style="background-color: var(--warning); color: #000;">حفظ التعديلات</button>
        <button class="close-btn" onclick="closeEditModal()">إلغاء</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getDatabase, ref, push, get, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";

    const firebaseConfig = {
      databaseURL: "https://myclinicsystem-f978f-default-rtdb.firebaseio.com/", 
      projectId: "myclinicsystem-f978f",
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const CLINIC_CODE = "MyClinic_1";
    let loggedInDoctorId = 0;

    async function loadDoctorsDropdowns() {
        try {
            const snapshot = await get(ref(db, `DoctorsConfig/${CLINIC_CODE}`));
            const secSelect = document.getElementById('secretaryDoctorSelect');
            const revSelect = document.getElementById('reviewDoctorSelect');
            
            secSelect.innerHTML = '<option value="">-- اختر الطبيب المعالج --</option>';
            revSelect.innerHTML = '<option value="">-- اختر الطبيب للعرض --</option>';

            if (snapshot.exists()) {
                const users = snapshot.val();
                for (let key in users) {
                    let u = users[key];
                    if (u.Role === "الطبيب") {
                        secSelect.innerHTML += `<option value="${u.DoctorID}">${u.FullName}</option>`;
                        revSelect.innerHTML += `<option value="${u.DoctorID}">${u.FullName}</option>`;
                    }
                }
            }
        } catch (e) { console.error(e); }
    }

    window.login = async function() {
        const uInput = document.getElementById('loginUsername').value.trim();
        const pInput = document.getElementById('loginPassword').value.trim();
        if (!uInput || !pInput) { alert("يرجى إدخال اسم المستخدم وكلمة المرور!"); return; }

        const btnLogin = document.getElementById('btnLogin');
        btnLogin.innerText = "جاري التحقق... ⏳"; btnLogin.disabled = true;

        try {
            const snapshot = await get(ref(db, `DoctorsConfig/${CLINIC_CODE}`));
            if (snapshot.exists()) {
                const users = snapshot.val();
                let foundUser = null;
                for (let key in users) {
                    if (users[key].Username === uInput && users[key].Password === pInput) {
                        foundUser = users[key]; break;
                    }
                }
                if (foundUser) {
                    localStorage.setItem('userRole', foundUser.Role);
                    localStorage.setItem('userFullName', foundUser.FullName);
                    localStorage.setItem('doctorId', foundUser.DoctorID);

                    if (foundUser.Role === "الطبيب") {
                        document.getElementById('welcomeDoc').innerText = `أهلاً بك، د. ${foundUser.FullName} 🩺`;
                        showScreen('doctorScreen'); loadDoctorDashboard();
                    } else {
                        document.getElementById('welcomeSec').innerText = `أهلاً بك، ${foundUser.FullName} 📋`;
                        showScreen('secretaryScreen'); await loadDoctorsDropdowns();
                    }
                } else { alert("❌ اسم المستخدم أو كلمة المرور غير صحيحة!"); }
            } else { alert("❌ لا توجد بيانات مستخدمين مسجلة سحابياً."); }
        } catch (error) { alert("خطأ في الاتصال: " + error.message); }
        btnLogin.innerText = "تسجيل الدخول"; btnLogin.disabled = false;
    }

    window.checkAutoLogin = async function() {
        const role = localStorage.getItem('userRole');
        const fullName = localStorage.getItem('userFullName');
        loggedInDoctorId = localStorage.getItem('doctorId');

        if(role === 'الطبيب') { 
            document.getElementById('welcomeDoc').innerText = `أهلاً بك، د. ${fullName} 🩺`;
            showScreen('doctorScreen'); loadDoctorDashboard(); 
        }
        else if (role) { 
            document.getElementById('welcomeSec').innerText = `أهلاً بك، ${fullName} 📋`;
            showScreen('secretaryScreen'); await loadDoctorsDropdowns();
        }
    }

    window.logout = function() {
        localStorage.clear();
        document.getElementById('loginUsername').value = '';
        document.getElementById('loginPassword').value = '';
        showScreen('loginScreen');
    }

    // إعدادات التعرف الصوتي والذكاء الاصطناعي
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ar-IQ';
        recognition.onstart = () => { document.getElementById('btnMic').innerText = "🔴 جاري الاستماع..."; };
        recognition.onresult = (e) => { document.getElementById('aiInput').value = e.results[0][0].transcript; analyzeWithAI(); };
        recognition.onerror = () => resetMicButton();
        recognition.onend = () => resetMicButton();
    }
    function resetMicButton() { document.getElementById('btnMic').innerText = "🎙️ تحدث الآن"; }
    window.startVoiceRecognition = () => { if(recognition) recognition.start(); else alert("متصفحك لا يدعم الصوت."); }

    window.analyzeWithAI = async function() {
        const aiText = document.getElementById('aiInput').value;
        if (!aiText) return;
        const btnAi = document.getElementById('btnAi');
        btnAi.innerText = "جاري التحليل... ⏳"; btnAi.disabled = true;

        const GEMINI_API_KEY = "ضع_مفتاح_جيميناي_الخاص_بك_هنا";
        const todayStr = new Date().toISOString().split('T')[0];
        const prompt = `أنت مساعد طبي. تاريخ اليوم: ${todayStr}. استخرج بيانات الحجز JSON فقط بدون ماركداون: name, phone, date, time, status, sequence. النص: "${aiText}"`;

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });
            const data = await res.json();
            const parsed = JSON.parse(data.candidates[0].content.parts[0].text.replace(/```json/g, "").replace(/```/g, "").trim());
            if(parsed.name) document.getElementById('resName').value = parsed.name;
            if(parsed.phone) document.getElementById('resPhone').value = parsed.phone;
            if(parsed.date) document.getElementById('resDate').value = parsed.date;
            if(parsed.time) document.getElementById('resTime').value = parsed.time;
            if(parsed.status) document.getElementById('resStatus').value = parsed.status;
            if(parsed.sequence) document.getElementById('resSeq').value = parsed.sequence;
            document.getElementById('aiInput').value = '';
            alert("✨ تم تحليل النص وتعبئته بنجاح!");
        } catch(e) { alert("خطأ في التحليل."); }
        btnAi.innerText = "تحليل وتعبئة"; btnAi.disabled = false;
    }

    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('resDate').value = today;
        document.getElementById('doctorDateFilter').value = today;
        document.getElementById('secReviewDateFilter').value = today;
        checkAutoLogin();
    }

    window.showScreen = function(screenId) {
        ['loginScreen', 'secretaryScreen', 'secretaryReviewScreen', 'doctorScreen'].forEach(id => document.getElementById(id).classList.add('hidden'));
        document.getElementById(screenId).classList.remove('hidden');
    }

    window.saveBooking = async function() {
        const docId = document.getElementById('secretaryDoctorSelect').value;
        const rDate = document.getElementById('resDate').value;
        const rSeq = document.getElementById('resSeq').value;
        const rTime = document.getElementById('resTime').value;
        const rName = document.getElementById('resName').value;
        const rPhone = document.getElementById('resPhone').value; 
        const rStatus = document.getElementById('resStatus').value;

        if(!docId) { alert("يرجى اختيار الطبيب المعالج!"); return; }
        if(!rDate || !rSeq || !rTime || !rName) { alert("يرجى تعبئة الحقول الأساسية!"); return; }

        try {
            const refPath = ref(db, `Bookings/${CLINIC_CODE}/${docId}/${rDate}`);
            const snapshot = await get(refPath);
            let conflict = false;
            if (snapshot.exists()) {
                const data = snapshot.val();
                for (let k in data) {
                    if (data[k].sequence == rSeq) { alert(`❌ التسلسل ${rSeq} محجوز مسبقاً.`); conflict = true; break; }
                }
            }
            if (!conflict) {
                await push(refPath, {
                    doctorID: parseInt(docId), sequence: parseInt(rSeq), time: rTime,
                    patientName: rName, phone: rPhone || "", patientStatus: rStatus || "",
                    syncState: "Pending", timestamp: new Date().getTime()
                });
                alert("✅ تم حفظ الحجز بنجاح!");
                document.getElementById('resName').value = ''; document.getElementById('resPhone').value = '';
                document.getElementById('resStatus').value = ''; document.getElementById('resSeq').value = parseInt(rSeq) + 1;
            }
        } catch(e) { alert("خطأ: " + e.message); }
    }

    window.openReviewScreen = async function() {
        showScreen('secretaryReviewScreen');
        await loadDoctorsDropdowns();
        if (!document.getElementById('secReviewDateFilter').value) {
            document.getElementById('secReviewDateFilter').value = new Date().toISOString().split('T')[0];
        }
    }

    window.loadReviewBookings = function() {
        const docId = document.getElementById('reviewDoctorSelect').value;
        const date = document.getElementById('secReviewDateFilter').value;
        const listDiv = document.getElementById('reviewBookingsList');
        const counterDiv = document.getElementById('secretaryCounter');
        
        if(!docId || !date) {
            listDiv.innerHTML = `<div style="text-align:center; color:#94A3B8; padding:20px;">يرجى اختيار الطبيب والتاريخ.</div>`;
            counterDiv.innerText = "📊 إجمالي الحجوزات: 0";
            return;
        }

        onValue(ref(db, `Bookings/${CLINIC_CODE}/${docId}/${date}`), (snapshot) => {
            listDiv.innerHTML = ''; 
            if (snapshot.exists()) {
                const data = snapshot.val();
                const arr = [];
                for(let k in data) { let b = data[k]; b.key = k; arr.push(b); }
                arr.sort((a, b) => a.sequence - b.sequence);
                
                counterDiv.innerText = `📊 إجمالي الحجوزات: ${arr.length}`;

                arr.forEach(b => {
                    const statusText = b.patientStatus ? `<div class="status-badge">📌 ${b.patientStatus}</div>` : '';
                    const phoneText = b.phone ? `<div>📱 الهاتف: ${b.phone}</div>` : '';
                    const editParams = `'${b.key}', '${docId}', '${date}', '${b.patientName.replace(/'/g,"\\'")}', '${b.phone || ""}', '${b.sequence}', '${b.time}', '${b.patientStatus ? b.patientStatus.replace(/'/g,"\\'") : ""}'`;
                    
                    listDiv.innerHTML += `
                    <div class="booking-card" style="border-right-color: #10B981;">
                        <div class="seq">تسلسل: ${b.sequence}</div>
                        <div>👤 المريض: ${b.patientName}</div>
                        <div>🕒 الوقت: ${b.time}</div>
                        ${phoneText}
                        ${statusText}
                        <div class="action-buttons">
                            <button class="edit-btn" onclick="openEditModal(${editParams})">✏️ تعديل</button>
                            <button class="delete-btn" onclick="deleteBooking('${docId}', '${date}', '${b.key}', '${b.patientName.replace(/'/g,"\\'")}')">🗑️ حذف</button>
                        </div>
                    </div>`;
                });
            } else { 
                listDiv.innerHTML = `<div style="text-align:center; color:#94A3B8; padding:20px;">لا توجد حجوزات في هذا التاريخ.</div>`; 
                counterDiv.innerText = "📊 إجمالي الحجوزات: 0";
            }
        });
    }

    window.deleteBooking = async function(docId, date, key, patientName) {
        if (confirm(`🗑️ هل أنت متأكد من حذف حجز المريض (${patientName}) نهائياً؟`)) {
            try {
                await remove(ref(db, `Bookings/${CLINIC_CODE}/${docId}/${date}/${key}`));
                alert("✅ تم حذف الحجز بنجاح.");
            } catch (error) {
                alert("❌ حدث خطأ أثناء الحذف: " + error.message);
            }
        }
    }

    window.openEditModal = function(key, docId, date, name, phone, seq, time, status) {
        document.getElementById('editKey').value = key; 
        document.getElementById('editDocId').value = docId; 
        document.getElementById('editDate').value = date; 
        document.getElementById('editName').value = name; 
        document.getElementById('editPhone').value = phone;
        document.getElementById('editSeq').value = seq; 
        document.getElementById('editTime').value = time;
        document.getElementById('editStatus').value = status; 
        document.getElementById('editModal').classList.remove('hidden');
    }

    window.closeEditModal = function() { document.getElementById('editModal').classList.add('hidden'); }

    window.saveEdit = async function() {
        const key = document.getElementById('editKey').value; 
        const docId = document.getElementById('editDocId').value; 
        const date = document.getElementById('editDate').value;
        
        const updatedData = {
            doctorID: parseInt(docId),
            patientName: document.getElementById('editName').value, 
            phone: document.getElementById('editPhone').value || "", 
            sequence: parseInt(document.getElementById('editSeq').value), 
            time: document.getElementById('editTime').value,
            patientStatus: document.getElementById('editStatus').value, 
            syncState: "Pending"
        };
        try {
            await update(ref(db, `Bookings/${CLINIC_CODE}/${docId}/${date}/${key}`), updatedData);
            alert("تم تحديث الحجز بنجاح!"); closeEditModal();
        } catch (error) { alert("خطأ: " + error.message); }
    }

    // شاشة الطبيب (بنلات مدورة الحواف حصرياً كما كانت في البداية)
    window.loadDoctorDashboard = function() {
        const selectedDate = document.getElementById('doctorDateFilter').value;
        const docId = localStorage.getItem('doctorId');
        const listDiv = document.getElementById('bookingsList');
        const counterDiv = document.getElementById('doctorCounter');

        if(!selectedDate || !docId) return;

        onValue(ref(db, `Bookings/${CLINIC_CODE}/${docId}/${selectedDate}`), (snapshot) => {
            listDiv.innerHTML = ''; 
            if (snapshot.exists()) {
                const data = snapshot.val(); const arr = [];
                for(let k in data) { arr.push(data[k]); }
                arr.sort((a, b) => a.sequence - b.sequence);
                
                counterDiv.innerText = `📊 إجمالي المراجعين: ${arr.length}`;

                arr.forEach(b => {
                    const statusHtml = b.patientStatus ? `<div class="status-badge">📌 ملاحظة: ${b.patientStatus}</div>` : '';
                    const phoneHtml = b.phone ? `<div>📱 الهاتف: ${b.phone}</div>` : ''; 
                    listDiv.innerHTML += `
                    <div class="booking-card">
                        <div class="seq">تسلسل: ${b.sequence}</div>
                        <div>👤 المريض: ${b.patientName}</div>
                        <div>🕒 الوقت: ${b.time}</div>
                        ${phoneHtml}
                        ${statusHtml}
                    </div>`;
                });
            } else { 
                listDiv.innerHTML = `<div style="text-align:center; color:#94A3B8; padding:20px;">لا توجد حجوزات في تاريخ ${selectedDate}</div>`; 
                counterDiv.innerText = "📊 إجمالي المراجعين: 0";
            }
        });
    }
</script>
</body>
</html>
